services:
  - type: web
    name: jobfinder-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: jobfinder-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: jobfinder-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://SEU_APP_VERCEL.vercel.app
      - key: REMOTIVE_BASE_URL
        value: https://remotive.com/api
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: jobfinder-db
    databaseName: jobfinder
    region: ohio
    plan: free
