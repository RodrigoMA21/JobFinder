services:
  - type: web
    name: jobfinder-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobfinder-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: jobfinder-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false

databases:
  - name: jobfinder-db
    databaseName: jobfinder
    region: ohio
    plan: free
