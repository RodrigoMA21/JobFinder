services:
  postgres:
    image: postgres:16-alpine
    container_name: jobfinder-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: jobfinder
      POSTGRES_DB: jobfinder
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
